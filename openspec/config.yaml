# openspec/config.yaml
schema: spec-driven

context: |
  Tech stack: Greenfield — no application source yet. GGA config
  (FILE_PATTERNS=*.ts,*.tsx,*.js,*.jsx) implies TypeScript/JavaScript;
  project name implies an AI psychological chat assistant web app.
  Architecture: Not yet established (no code). Expect modern TS/JS web
  stack (e.g. React/Next.js + Node) once scaffolded.
  Testing: No test runner configured (no package.json/pyproject/go.mod).
  Toolchain available: node v26.7.0, npm 11.19.0, pnpm 11.1.1, bun 1.3.11,
  yarn 4.13.0, python 3.12/3.14, cargo 1.95. No in-project test command yet.
  Style: GGA provider=opencode, RULES_FILE=AGENTS.md, .atl skill registry.

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing code patterns
      - Strict TDD: write failing tests before implementation (Vitest)
      - Keep each work-unit commit reviewable (tests + docs with code)
    tdd: true            # Strict TDD active per user decision; Vitest once scaffolded
    test_command: "pnpm --filter <pkg> test"
  verify:
    test_command: ""
    build_command: ""
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
